plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.poesiaycumbia.radio'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.poesiaycumbia.radio.mobile'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Firmado con la clave debug para poder instalar por ADB/archivo sin keystore propio
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
